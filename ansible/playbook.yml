---
- name: Setup Hibana Stack
  hosts: hibana_server
  become: yes
  gather_facts: yes

  roles:
    - role: prerequisites
      tags: [prerequisites, always]

    - role: system_users
      tags: [users]
      when: system_users is defined

    - role: postgresql
      tags: [postgresql, database]

    - role: powerdns
      tags: [powerdns, dns]
      when: dns_provider is defined and dns_provider.type == 'local'

    - role: mail_server
      tags: [mail, postfix, dovecot]

    - role: dkim
      tags: [mail, dkim, security]

    - role: spamassassin
      tags: [mail, spam]

    - role: fail2ban
      tags: [security, fail2ban]

    - role: dns_records
      tags: [dns, records]

    - role: traefik
      tags: [traefik, proxy]

    - role: domain_user
      tags: [users, domain_user]
      when: domain_user is defined

    - role: docker_containers
      tags: [docker, containers, web]

  post_tasks:
    - name: Build enabled roles list
      set_fact:
        enabled_roles: "{{ subdomains | default([]) | map(attribute='role') | list }}"

    - name: Build service URLs for summary
      set_fact:
        summary_urls: |
          {% if 'webadmin' in enabled_roles %}  • Web admin:  https://adm.{{ primary_domain }}
          {% endif %}{% if 'webmail' in enabled_roles %}  • Webmail:    https://webmail.{{ primary_domain }}
          {% endif %}{% if 'website' in enabled_roles %}  • Website:    https://www.{{ primary_domain }}
          {% endif %}{% if 'mailserver' in enabled_roles %}  • Mail:       mail.{{ primary_domain }}
          {% endif %}

    - name: Build PTR reminder if mailserver is enabled
      set_fact:
        ptr_reminder: |
          {% if 'mailserver' in enabled_roles %}
          ⚠️  For email deliverability, ensure PTR records are configured:
              → IPv4 PTR: mail.{{ primary_domain }}
              → IPv6 PTR: mail.{{ primary_domain }}
              (Configure in your VPS provider's control panel)
          {% endif %}

    - name: Display installation summary
      debug:
        msg: |
          ✅ Hibana Stack installation complete!

          Your services are now available at:
          {{ summary_urls }}
          Don't forget to update your domain's nameservers to point to this server!
          {{ ptr_reminder }}
