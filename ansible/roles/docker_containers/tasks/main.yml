---
# ============================================================================
# New /srv/ Microservices Architecture
# Each service is isolated in its own directory with dedicated compose file
# ============================================================================

- name: Create Traefik network
  docker_network:
    name: traefik-network
    state: present

# ============================================================================
# Traefik Service (Reverse Proxy & SSL)
# ============================================================================

- name: Create Traefik service directory
  file:
    path: "/srv/traefik/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ''
    - 'dynamic'

- name: Create Traefik static configuration
  template:
    src: traefik/traefik.yml.j2
    dest: /srv/traefik/traefik.yml
    owner: root
    group: root
    mode: '0644'

- name: Create Traefik dynamic middlewares
  template:
    src: traefik/middlewares.yml.j2
    dest: /srv/traefik/dynamic/middlewares.yml
    owner: root
    group: root
    mode: '0644'

- name: Create Traefik docker-compose
  template:
    src: traefik/docker-compose.yml.j2
    dest: /srv/traefik/docker-compose.yml
    owner: root
    group: root
    mode: '0644'

- name: Create acme.json for Let's Encrypt
  file:
    path: /srv/traefik/acme.json
    state: touch
    mode: '0600'
    owner: root
    group: root

- name: Start Traefik service
  docker_compose:
    project_src: /srv/traefik
    state: present
  register: traefik_result

# ============================================================================
# www Service (Main Website)
# ============================================================================

- name: Create www service directories
  file:
    path: "/srv/www.{{ primary_domain }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ''
    - 'src'
    - 'nginx'
    - 'logs'

- name: Copy www Dockerfile
  copy:
    src: www-Dockerfile
    dest: "/srv/www.{{ primary_domain }}/src/Dockerfile"
    owner: root
    group: root
    mode: '0644'

- name: Create www index.html
  template:
    src: www-index.html.j2
    dest: "/srv/www.{{ primary_domain }}/src/index.html"
    owner: root
    group: root
    mode: '0644'

- name: Create www nginx configuration
  template:
    src: www-nginx.conf.j2
    dest: "/srv/www.{{ primary_domain }}/nginx/default.conf"
    owner: root
    group: root
    mode: '0644'

- name: Create www docker-compose
  template:
    src: www-docker-compose.yml.j2
    dest: "/srv/www.{{ primary_domain }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Start www service
  docker_compose:
    project_src: "/srv/www.{{ primary_domain }}"
    build: yes
    state: present
  register: www_result

# ============================================================================
# adm Service (Admin Interface)
# ============================================================================

- name: Create adm service directories
  file:
    path: "/srv/adm.{{ primary_domain }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ''
    - 'app'
    - 'data'
    - 'logs'

- name: Copy adm Dockerfile
  copy:
    src: adm-Dockerfile
    dest: "/srv/adm.{{ primary_domain }}/app/Dockerfile"
    owner: root
    group: root
    mode: '0644'

- name: Create adm index.html
  template:
    src: adm-index.html.j2
    dest: "/srv/adm.{{ primary_domain }}/app/index.html"
    owner: root
    group: root
    mode: '0644'

- name: Create adm .env file
  template:
    src: adm-env.j2
    dest: "/srv/adm.{{ primary_domain }}/.env"
    owner: root
    group: root
    mode: '0644'

- name: Create adm docker-compose
  template:
    src: adm-docker-compose.yml.j2
    dest: "/srv/adm.{{ primary_domain }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Start adm service
  docker_compose:
    project_src: "/srv/adm.{{ primary_domain }}"
    build: yes
    state: present
  register: adm_result

# ============================================================================
# webmail Service (Roundcube)
# ============================================================================

- name: Create webmail service directories
  file:
    path: "/srv/webmail.{{ primary_domain }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ''
    - 'data'
    - 'logs'

- name: Create webmail .env file
  template:
    src: webmail-env.j2
