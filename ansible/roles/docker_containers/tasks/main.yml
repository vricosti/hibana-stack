    owner: root
    group: root
    mode: '0644'

- name: Create webmail docker-compose
  template:
    src: webmail-docker-compose.yml.j2
    dest: "/srv/webmail.{{ primary_domain }}/docker-compose.yml"
    owner: root
    group: root
