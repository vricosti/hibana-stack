---
# ============================================================================
# /srv/ Microservices Architecture - Domain-based Organization
# Structure: /srv/<domain>/<service>/ (e.g., /srv/primarydomain.com/api/)
# Each service is isolated in its own directory with dedicated compose file
# ============================================================================

- name: Create Traefik network
  docker_network:
    name: traefik-network
    state: present

# ============================================================================
# Traefik Service (Reverse Proxy & SSL)
# ============================================================================

- name: Create Traefik service directory
  file:
    path: "/srv/traefik/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ''
    - 'dynamic'

- name: Create Traefik static configuration
  template:
    src: traefik/traefik.yml.j2
    dest: /srv/traefik/traefik.yml
    owner: root
    group: root
    mode: '0644'

- name: Create Traefik dynamic middlewares
  template:
    src: traefik/middlewares.yml.j2
    dest: /srv/traefik/dynamic/middlewares.yml
    owner: root
    group: root
    mode: '0644'

- name: Create Traefik docker-compose
  template:
    src: traefik/docker-compose.yml.j2
    dest: /srv/traefik/docker-compose.yml
    owner: root
    group: root
    mode: '0644'

- name: Create acme.json for Let's Encrypt
  file:
    path: /srv/traefik/acme.json
    state: touch
    mode: '0600'
    owner: root
    group: root

- name: Start Traefik service
  docker_compose:
    project_src: /srv/traefik
    state: present
  register: traefik_result

# ============================================================================
# www Service (Main Website)
# ============================================================================

- name: Create www service directories
  file:
    path: "/srv/{{ primary_domain }}/www/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ''
    - 'src'
    - 'nginx'
    - 'logs'

- name: Copy www Dockerfile
  copy:
    src: www-Dockerfile
    dest: "/srv/{{ primary_domain }}/www/src/Dockerfile"
    owner: root
    group: root
    mode: '0644'

- name: Create www index.html
  template:
    src: www-index.html.j2
    dest: "/srv/{{ primary_domain }}/www/src/index.html"
    owner: root
    group: root
    mode: '0644'

- name: Create www nginx configuration
  template:
    src: www-nginx.conf.j2
    dest: "/srv/{{ primary_domain }}/www/nginx/default.conf"
    owner: root
    group: root
    mode: '0644'

- name: Create www docker-compose
  template:
    src: www-docker-compose.yml.j2
    dest: "/srv/{{ primary_domain }}/www/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Start www service
  docker_compose:
    project_src: "/srv/{{ primary_domain }}/www"
    build: yes
    state: present
  register: www_result

# ============================================================================
# adm Service (Admin Interface)
# ============================================================================

- name: Create adm service directories
  file:
    path: "/srv/{{ primary_domain }}/adm/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ''
    - 'app'
    - 'data'
    - 'logs'

- name: Copy adm Dockerfile
  copy:
    src: adm-Dockerfile
    dest: "/srv/{{ primary_domain }}/adm/app/Dockerfile"
    owner: root
    group: root
    mode: '0644'

- name: Create adm index.html
  template:
    src: adm-index.html.j2
    dest: "/srv/{{ primary_domain }}/adm/app/index.html"
    owner: root
    group: root
    mode: '0644'

- name: Create adm .env file
  template:
    src: adm-env.j2
    dest: "/srv/{{ primary_domain }}/adm/.env"
    owner: root
    group: root
    mode: '0644'

- name: Create adm docker-compose
  template:
    src: adm-docker-compose.yml.j2
    dest: "/srv/{{ primary_domain }}/adm/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Start adm service
  docker_compose:
    project_src: "/srv/{{ primary_domain }}/adm"
    build: yes
    state: present
  register: adm_result

# ============================================================================
# webmail Service (Roundcube)
# ============================================================================

- name: Create webmail service directories
  file:
    path: "/srv/{{ primary_domain }}/webmail/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ''
    - 'data'
    - 'logs'

- name: Create webmail .env file
  template:
    src: webmail-env.j2
    dest: "/srv/{{ primary_domain }}/webmail/.env"
    owner: root
    group: root
    mode: '0644'

- name: Create webmail docker-compose
  template:
    src: webmail-docker-compose.yml.j2
    dest: "/srv/{{ primary_domain }}/webmail/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Start webmail service
  docker_compose:
    project_src: "/srv/{{ primary_domain }}/webmail"
    state: present
  register: webmail_result

# ============================================================================
# api Service (REST API Backend)
# ============================================================================

- name: Create api service directories
  file:
    path: "/srv/{{ primary_domain }}/api/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ''
    - 'app'
    - 'data'
    - 'logs'
    - 'secrets'

- name: Check if pre-built API exists
  stat:
    path: "{{ playbook_dir }}/api-build/hibana-api"
  register: prebuilt_api

- name: Check if pre-built frontend exists
  stat:
    path: "{{ playbook_dir }}/api-build/web"
  register: prebuilt_frontend

- name: Copy pre-built API and frontend (if available)
  when: prebuilt_api.stat.exists and prebuilt_frontend.stat.exists
  block:
    - name: Copy pre-built API binary
      copy:
        src: "{{ playbook_dir }}/api-build/hibana-api"
        dest: "/srv/{{ primary_domain }}/api/app/hibana-api"
        owner: root
        group: root
        mode: '0755'

    - name: Copy pre-built frontend
      synchronize:
        src: "{{ playbook_dir }}/api-build/web/"
        dest: "/srv/{{ primary_domain }}/api/app/web/"
        delete: yes
      delegate_to: localhost

    - name: Copy pre-built Dockerfile
      copy:
        src: "{{ playbook_dir }}/api-build/Dockerfile"
        dest: "/srv/{{ primary_domain }}/api/app/Dockerfile"
        owner: root
        group: root
        mode: '0644'

- name: Use placeholder API (if pre-built not available)
  when: not prebuilt_api.stat.exists or not prebuilt_frontend.stat.exists
  block:
    - name: Create placeholder API files
      template:
        src: "api-{{ item }}.j2"
        dest: "/srv/{{ primary_domain }}/api/app/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - 'main.go'
        - 'go.mod'
        - 'Dockerfile'

- name: Create api .env file
  template:
    src: api-env.j2
    dest: "/srv/{{ primary_domain }}/api/.env"
    owner: root
    group: root
    mode: '0644'

- name: Create api docker-compose
  template:
    src: api-docker-compose.yml.j2
    dest: "/srv/{{ primary_domain }}/api/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Check if JWT secret exists
  stat:
    path: "/srv/{{ primary_domain }}/api/secrets/jwt_secret"
  register: jwt_secret_file

- name: Generate JWT secret if not exists
  shell: openssl rand -base64 32
  register: jwt_secret
  when: not jwt_secret_file.stat.exists

- name: Save JWT secret
  copy:
    content: "{{ jwt_secret.stdout }}"
    dest: "/srv/{{ primary_domain }}/api/secrets/jwt_secret"
    owner: root
    group: root
    mode: '0600'
  when: not jwt_secret_file.stat.exists and jwt_secret.stdout is defined

- name: Read hibana database password
  slurp:
    src: /etc/hibana/passwords/hibana
  register: hibana_db_password_file

- name: Create database password secret
  copy:
    content: "{{ hibana_db_password_file.content | b64decode }}"
    dest: "/srv/{{ primary_domain }}/api/secrets/db_password"
    owner: root
    group: root
    mode: '0600'

- name: Start api service
  docker_compose:
    project_src: "/srv/{{ primary_domain }}/api"
    build: yes
    state: present
  register: api_result

# ============================================================================
# Display Results
# ============================================================================

- name: Display service deployment results
  debug:
    msg:
      - "Traefik: {{ traefik_result.state }}"
      - "WWW: {{ www_result.state }}"
      - "Admin: {{ adm_result.state }}"
      - "Webmail: {{ webmail_result.state }}"
      - "API: {{ api_result.state }}"

- name: Display service URLs
  debug:
    msg:
      - "Main Website: https://www.{{ primary_domain }}"
      - "Admin Interface: https://adm.{{ primary_domain }}"
      - "Webmail: https://webmail.{{ primary_domain }}"
      - "API: https://api.{{ primary_domain }}"
