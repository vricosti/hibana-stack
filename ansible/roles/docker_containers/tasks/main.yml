---
# ============================================================================
# /srv/ Microservices Architecture - Domain-based Organization
# Structure: /srv/<domain-tld>/<service>/ (e.g., /srv/primarydomain-com/api/)
# Each service is isolated in its own directory with dedicated compose file
# Domain path format: dots replaced with hyphens (linkedingue.com -> linkedingue-com)
# ============================================================================

# Build helper facts to check which services are enabled
- name: Build list of enabled subdomain names
  set_fact:
    enabled_subdomains: "{{ subdomains | default([]) | map(attribute='name') | list }}"

- name: Build list of enabled roles
  set_fact:
    enabled_roles: "{{ subdomains | default([]) | map(attribute='role') | list }}"

- name: Set domain path variable
  set_fact:
    domain_path: "/srv/{{ primary_domain | replace('.', '-') }}"
    domain_username: "{{ primary_domain | replace('.', '-') }}"

- name: Create domain root directory with proper ownership
  file:
    path: "{{ domain_path }}"
    state: directory
    owner: "{{ domain_username if domain_user is defined else 'root' }}"
    group: "{{ 'hibana-domains' if domain_user is defined else 'root' }}"
    mode: '0755'

- name: Create Traefik network
  docker_network:
    name: traefik-network
    state: present

# ============================================================================
# Traefik Service (Reverse Proxy & SSL)
# ============================================================================

- name: Create Traefik service directory
  file:
    path: "/srv/traefik/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ''
    - 'dynamic'

- name: Create Traefik static configuration
  template:
    src: traefik/traefik.yml.j2
    dest: /srv/traefik/traefik.yml
    owner: root
    group: root
    mode: '0644'

- name: Create Traefik dynamic middlewares
  template:
    src: traefik/middlewares.yml.j2
    dest: /srv/traefik/dynamic/middlewares.yml
    owner: root
    group: root
    mode: '0644'

- name: Create Traefik domain redirects configuration
  template:
    src: traefik/redirects.yml.j2
    dest: /srv/traefik/dynamic/redirects.yml
    owner: root
    group: root
    mode: '0644'

- name: Create Traefik docker-compose
  template:
    src: traefik/docker-compose.yml.j2
    dest: /srv/traefik/docker-compose.yml
    owner: root
    group: root
    mode: '0644'

- name: Create acme.json for Let's Encrypt
  file:
    path: /srv/traefik/acme.json
    state: touch
    mode: '0600'
    owner: root
    group: root

- name: Stop Traefik service (cleanup)
  docker_compose:
    project_src: /srv/traefik
    state: absent
  ignore_errors: yes

- name: Start Traefik service
  docker_compose:
    project_src: /srv/traefik
    state: present
  register: traefik_result

# ============================================================================
# www Service (Main Website) - Only if website role is enabled
# ============================================================================

- name: Deploy www service
  when: "'website' in enabled_roles"
  block:
    - name: Create www service directories
      file:
        path: "{{ domain_path }}/www/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - ''
        - '_default'
        - '_default/src'
        - '_default/nginx'
        - 'logs'

    - name: Copy www Dockerfile
      copy:
        src: www-Dockerfile
        dest: "{{ domain_path }}/www/_default/src/Dockerfile"
        owner: root
        group: root
        mode: '0644'

    - name: Create www index.html
      template:
        src: www-index.html.j2
        dest: "{{ domain_path }}/www/_default/src/index.html"
        owner: root
        group: root
        mode: '0644'

    - name: Create www nginx configuration
      template:
        src: www-nginx.conf.j2
        dest: "{{ domain_path }}/www/_default/nginx/default.conf"
        owner: root
        group: root
        mode: '0644'

    - name: Create www docker-compose
      template:
        src: www-docker-compose.yml.j2
        dest: "{{ domain_path }}/www/_default/docker-compose.yml"
        owner: root
        group: root
        mode: '0644'

    - name: Stop www service (cleanup)
      docker_compose:
        project_src: "{{ domain_path }}/www/_default"
        state: absent
      ignore_errors: yes

    - name: Start www service
      docker_compose:
        project_src: "{{ domain_path }}/www/_default"
        build: yes
        state: present
      register: www_result

- name: Set www_result when skipped
  set_fact:
    www_result: { "changed": false, "skipped": true }
  when: "'website' not in enabled_roles"

# ============================================================================
# webmail Service (Roundcube) - Only if webmail role is enabled
# ============================================================================

- name: Deploy webmail service
  when: "'webmail' in enabled_roles"
  block:
    - name: Create webmail service directories
      file:
        path: "{{ domain_path }}/webmail/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - ''
        - 'data'
        - 'logs'

    - name: Set webmail data directory ownership for www-data
      file:
        path: "{{ domain_path }}/webmail/data"
        owner: '33'
        group: '33'
        mode: '0755'

    - name: Create webmail .env file
      template:
        src: webmail-env.j2
        dest: "{{ domain_path }}/webmail/.env"
        owner: root
        group: root
        mode: '0644'

    - name: Create webmail docker-compose
      template:
        src: webmail-docker-compose.yml.j2
        dest: "{{ domain_path }}/webmail/docker-compose.yml"
        owner: root
        group: root
        mode: '0644'

    - name: Stop webmail service (cleanup)
      docker_compose:
        project_src: "{{ domain_path }}/webmail"
        state: absent
      ignore_errors: yes

    - name: Start webmail service
      docker_compose:
        project_src: "{{ domain_path }}/webmail"
        state: present
      register: webmail_result

- name: Set webmail_result when skipped
  set_fact:
    webmail_result: { "changed": false, "skipped": true }
  when: "'webmail' not in enabled_roles"

# ============================================================================
# adm Service (Admin Interface - API + Frontend)
# ============================================================================

- name: Create adm service directories
  file:
    path: "{{ domain_path }}/adm/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - ''
    - 'app'
    - 'data'
    - 'logs'
    - 'secrets'

- name: Check if pre-built API exists
  stat:
    path: "{{ playbook_dir }}/api-build/hibana-api"
  register: prebuilt_api

- name: Check if pre-built frontend exists
  stat:
    path: "{{ playbook_dir }}/api-build/web"
  register: prebuilt_frontend

- name: Copy pre-built API and frontend (if available)
  when: prebuilt_api.stat.exists and prebuilt_frontend.stat.exists
  block:
    - name: Copy pre-built API binary
      copy:
        src: "{{ playbook_dir }}/api-build/hibana-api"
        dest: "{{ domain_path }}/adm/app/hibana-api"
        owner: root
        group: root
        mode: '0755'

    - name: Copy pre-built frontend
      synchronize:
        src: "{{ playbook_dir }}/api-build/web/"
        dest: "{{ domain_path }}/adm/app/web/"
        delete: yes
      delegate_to: localhost

    - name: Copy pre-built Dockerfile
      copy:
        src: "{{ playbook_dir }}/api-build/Dockerfile"
        dest: "{{ domain_path }}/adm/app/Dockerfile"
        owner: root
        group: root
        mode: '0644'

- name: Use placeholder API (if pre-built not available)
  when: not prebuilt_api.stat.exists or not prebuilt_frontend.stat.exists
  block:
    - name: Create placeholder API files
      template:
        src: "api-{{ item }}.j2"
        dest: "{{ domain_path }}/adm/app/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - 'main.go'
        - 'go.mod'
        - 'Dockerfile'

- name: Create adm .env file
  template:
    src: api-env.j2
    dest: "{{ domain_path }}/adm/.env"
    owner: root
    group: root
    mode: '0644'

- name: Create adm docker-compose
  template:
    src: api-docker-compose.yml.j2
    dest: "{{ domain_path }}/adm/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Check if JWT secret exists
  stat:
    path: "{{ domain_path }}/adm/secrets/jwt_secret"
  register: jwt_secret_file

- name: Generate JWT secret if not exists
  shell: openssl rand -base64 32
  register: jwt_secret
  when: not jwt_secret_file.stat.exists

- name: Save JWT secret
  copy:
    content: "{{ jwt_secret.stdout }}"
    dest: "{{ domain_path }}/adm/secrets/jwt_secret"
    owner: root
    group: root
    mode: '0600'
  when: not jwt_secret_file.stat.exists and jwt_secret.stdout is defined

- name: Read hibana database password
  slurp:
    src: /etc/hibana/passwords/hibana
  register: hibana_db_password_file

- name: Create database password secret
  copy:
    content: "{{ hibana_db_password_file.content | b64decode }}"
    dest: "{{ domain_path }}/adm/secrets/db_password"
    owner: root
    group: root
    mode: '0600'

- name: Read pdns database password
  slurp:
    src: /etc/hibana/passwords/pdns
  register: pdns_db_password_file

- name: Create pdns password secret
  copy:
    content: "{{ pdns_db_password_file.content | b64decode }}"
    dest: "{{ domain_path }}/adm/secrets/pdns_password"
    owner: root
    group: root
    mode: '0600'

- name: Stop legacy api service (cleanup)
  docker_compose:
    project_src: "{{ domain_path }}/api"
    state: absent
  ignore_errors: yes

- name: Stop adm service (cleanup)
  docker_compose:
    project_src: "{{ domain_path }}/adm"
    state: absent
  ignore_errors: yes

- name: Start adm service
  docker_compose:
    project_src: "{{ domain_path }}/adm"
    build: yes
    state: present
  register: adm_result

# ============================================================================
# Display Results
# ============================================================================

- name: Build deployment results list
  set_fact:
    deployment_results:
      - "Traefik: {{ 'deployed' if traefik_result.changed else 'already running' }}"

- name: Add WWW to results if enabled
  set_fact:
    deployment_results: "{{ deployment_results + ['WWW: ' + ('deployed' if www_result.changed else ('skipped' if www_result.skipped | default(false) else 'already running'))] }}"

- name: Add Webmail to results if enabled
  set_fact:
    deployment_results: "{{ deployment_results + ['Webmail: ' + ('deployed' if webmail_result.changed else ('skipped' if webmail_result.skipped | default(false) else 'already running'))] }}"

- name: Add Admin to results
  set_fact:
    deployment_results: "{{ deployment_results + ['Admin: ' + ('deployed' if adm_result.changed else 'already running')] }}"

- name: Display service deployment results
  debug:
    msg: "{{ deployment_results }}"

- name: Build service URLs list
  set_fact:
    service_urls:
      - "Admin Interface: https://adm.{{ primary_domain }}"

- name: Add WWW URL if enabled
  set_fact:
    service_urls: "{{ service_urls + ['Main Website: https://www.' + primary_domain] }}"
  when: "'website' in enabled_roles"

- name: Add Webmail URL if enabled
  set_fact:
    service_urls: "{{ service_urls + ['Webmail: https://webmail.' + primary_domain] }}"
  when: "'webmail' in enabled_roles"

- name: Display service URLs
  debug:
    msg: "{{ service_urls }}"
