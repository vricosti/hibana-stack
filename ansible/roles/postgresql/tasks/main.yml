---
- name: Detect installed PostgreSQL version
  shell: "ls -1 /usr/lib/postgresql/ | sort -V | tail -1"
  register: pg_version_detect
  changed_when: false

- name: Set PostgreSQL version fact
  set_fact:
    pg_version: "{{ pg_version_detect.stdout }}"

- name: Display detected PostgreSQL version
  debug:
    msg: "Detected PostgreSQL version: {{ pg_version }}"

- name: Check if PostgreSQL data directory exists
  stat:
    path: "/var/lib/postgresql/{{ pg_version }}/main"
  register: pg_datadir

- name: Check if PostgreSQL cluster is registered
  command: pg_lsclusters -h
  register: pg_clusters
  failed_when: false
  changed_when: false

- name: Display existing clusters
  debug:
    var: pg_clusters.stdout_lines

- name: Check if main cluster is registered
  set_fact:
    cluster_registered: "{{ pg_clusters.stdout | regex_search(pg_version + '\\s+main') is not none }}"

- name: Remove broken cluster registration if data dir missing
  command: "pg_dropcluster --stop {{ pg_version }} main"
  when: cluster_registered and not pg_datadir.stat.exists
  failed_when: false

- name: Create PostgreSQL cluster
  command: "pg_createcluster {{ pg_version }} main"
  when: not pg_datadir.stat.exists
  register: cluster_create

- name: Display cluster creation result
  debug:
    var: cluster_create
  when: cluster_create is defined

- name: Ensure PostgreSQL is enabled
  systemd:
    name: postgresql
    enabled: yes

- name: Disable SSL in PostgreSQL configuration
  lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/postgresql.conf"
    regexp: '^ssl\s*='
    line: 'ssl = off'
    state: present

- name: Get Docker bridge gateway IP
  shell: "docker network inspect bridge --format '{{ '{{' }}range .IPAM.Config{{ '}}' }}{{ '{{' }}.Gateway{{ '}}' }}{{ '{{' }}end{{ '}}' }}'"
  register: docker_bridge_ip
  changed_when: false
  failed_when: false

- name: Set Docker bridge IP (default if detection fails)
  set_fact:
    docker_gateway_ip: "{{ docker_bridge_ip.stdout | default('172.17.0.1', true) | trim }}"

- name: Display detected Docker bridge IP
  debug:
    msg: "Docker bridge gateway IP: {{ docker_gateway_ip }}"

- name: Configure PostgreSQL to listen on Docker bridge network
  lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/postgresql.conf"
    regexp: '^#?listen_addresses\s*='
    line: "listen_addresses = 'localhost,{{ docker_gateway_ip }}'"
    state: present

- name: Allow all Docker networks in pg_hba.conf (172.16.0.0/12)
  lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
    line: "host all all 172.16.0.0/12 md5"
    state: present
  register: pg_hba_changed

- name: Restart PostgreSQL to apply configuration changes
  command: "pg_ctlcluster {{ pg_version }} main restart"
  when: pg_hba_changed.changed
  failed_when: false

- name: Check if PostgreSQL cluster is running
  shell: "pg_lsclusters -h | grep '{{ pg_version }}.*main' | awk '{print $4}'"
  register: cluster_status
  changed_when: false
  failed_when: false

- name: Display initial cluster status
  debug:
    msg: "Cluster status: {{ cluster_status.stdout }}"

- name: Start PostgreSQL cluster if not running
  command: "pg_ctlcluster {{ pg_version }} main start"
  when: cluster_status.stdout != "online"
  register: pg_start

- name: Wait for PostgreSQL to be ready
  pause:
    seconds: 5

- name: Verify cluster is now online
  shell: "pg_lsclusters -h | grep '{{ pg_version }}.*main'"
  register: final_cluster_status
  changed_when: false

- name: Display final cluster status
  debug:
    var: final_cluster_status.stdout_lines

- name: Wait for PostgreSQL socket
  wait_for:
    path: /var/run/postgresql/.s.PGSQL.5432
    timeout: 30
    state: present

- name: Verify PostgreSQL is accepting connections
  command: pg_isready -h localhost
  register: pg_ready
  retries: 10
  delay: 3
  until: pg_ready.rc == 0
  changed_when: false

- name: Check if hibana password file exists
  stat:
    path: /etc/hibana/passwords/hibana
  register: hibana_password_file

- name: Check if pdns password file exists
  stat:
    path: /etc/hibana/passwords/pdns
  register: pdns_password_file

- name: Read existing hibana password
  slurp:
    src: /etc/hibana/passwords/hibana
  register: hibana_password_content
  when: hibana_password_file.stat.exists

- name: Read existing pdns password
  slurp:
    src: /etc/hibana/passwords/pdns
  register: pdns_password_content
  when: pdns_password_file.stat.exists

- name: Set hibana password from existing file
  set_fact:
    hibana_db_password: "{{ hibana_password_content.content | b64decode | trim }}"
  when: hibana_password_file.stat.exists

- name: Generate new hibana password if not exists
  set_fact:
    hibana_db_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  when: not hibana_password_file.stat.exists

- name: Set pdns password from existing file
  set_fact:
    pdns_db_password: "{{ pdns_password_content.content | b64decode | trim }}"
  when: pdns_password_file.stat.exists

- name: Generate new pdns password if not exists
  set_fact:
    pdns_db_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  when: not pdns_password_file.stat.exists

- name: Create hibana database
  postgresql_db:
    name: hibana
    state: present
  become_user: postgres

- name: Create hibana database user
  postgresql_user:
    name: hibana
    password: "{{ hibana_db_password }}"
    db: hibana
    priv: ALL
    state: present
  become_user: postgres

- name: Create Hibana schema
  postgresql_query:
    db: hibana
    query: |
      CREATE TABLE IF NOT EXISTS domains (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) UNIQUE NOT NULL,
        server_ip VARCHAR(45) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );

      CREATE TABLE IF NOT EXISTS email_accounts (
        id SERIAL PRIMARY KEY,
        domain_id INTEGER REFERENCES domains(id) ON DELETE CASCADE,
        username VARCHAR(255) NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        full_name VARCHAR(255),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(domain_id, username)
      );

      CREATE TABLE IF NOT EXISTS dkim_keys (
        id SERIAL PRIMARY KEY,
        domain_id INTEGER REFERENCES domains(id) ON DELETE CASCADE,
        selector VARCHAR(255) NOT NULL,
        private_key TEXT NOT NULL,
        public_key TEXT NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(domain_id, selector)
      );

      CREATE TABLE IF NOT EXISTS domain_users (
        id SERIAL PRIMARY KEY,
        domain_id INTEGER NOT NULL REFERENCES domains(id) ON DELETE CASCADE,
        username VARCHAR(255) NOT NULL,
        ssh_public_key TEXT,
        ssh_private_key_encrypted TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(domain_id)
      );

      CREATE TABLE IF NOT EXISTS installation_state (
        id SERIAL PRIMARY KEY,
        step VARCHAR(255) NOT NULL,
        status VARCHAR(50) NOT NULL,
        firewall_rules_before TEXT,
        firewall_rules_after TEXT,
        ports_opened TEXT,
        started_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        completed_at TIMESTAMP,
        error_message TEXT
      );

      CREATE TABLE IF NOT EXISTS webadmin_users (
        id SERIAL PRIMARY KEY,
        username VARCHAR(255) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );

      CREATE TABLE IF NOT EXISTS configuration (
        id SERIAL PRIMARY KEY,
        key VARCHAR(255) UNIQUE NOT NULL,
        value TEXT,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );

      CREATE TABLE IF NOT EXISTS dns_providers (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        type VARCHAR(50) NOT NULL,
        provider VARCHAR(50) NOT NULL UNIQUE,
        api_token TEXT,
        endpoint VARCHAR(100),
        application_key TEXT,
        application_secret TEXT,
        consumer_key TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );

      CREATE TABLE IF NOT EXISTS email_aliases (
        id SERIAL PRIMARY KEY,
        domain_id INTEGER NOT NULL REFERENCES domains(id) ON DELETE CASCADE,
        source_address VARCHAR(255) NOT NULL,
        destination_addresses TEXT NOT NULL,
        is_active BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(domain_id, source_address)
      );

      CREATE TABLE IF NOT EXISTS subdomains (
        id SERIAL PRIMARY KEY,
        domain_id INTEGER NOT NULL REFERENCES domains(id) ON DELETE CASCADE,
        name VARCHAR(63) NOT NULL,
        role VARCHAR(50) NOT NULL DEFAULT 'website',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(domain_id, name)
      );

      CREATE TABLE IF NOT EXISTS dns_backup (
        id SERIAL PRIMARY KEY,
        domain_name VARCHAR(255) NOT NULL,
        provider VARCHAR(50) NOT NULL,
        record_type VARCHAR(10) NOT NULL,
        record_name VARCHAR(255) NOT NULL,
        record_content TEXT NOT NULL,
        record_ttl INTEGER,
        record_priority INTEGER,
        backup_reason VARCHAR(100),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );

      CREATE INDEX IF NOT EXISTS dns_backup_domain_idx ON dns_backup(domain_name);
      CREATE INDEX IF NOT EXISTS dns_backup_created_idx ON dns_backup(created_at);

      -- Grant all privileges to hibana user
      GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO hibana;
      GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO hibana;

      -- Set default privileges for future tables
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO hibana;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO hibana;
  become_user: postgres

- name: Create powerdns database
  postgresql_db:
    name: powerdns
    state: present
  become_user: postgres

- name: Create powerdns database user
  postgresql_user:
    name: pdns
    password: "{{ pdns_db_password }}"
    db: powerdns
    priv: ALL
    state: present
  become_user: postgres

- name: Create PowerDNS schema
  postgresql_query:
    db: powerdns
    query: |
      CREATE TABLE IF NOT EXISTS domains (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL UNIQUE,
        master VARCHAR(128) DEFAULT NULL,
        last_check INT DEFAULT NULL,
        type VARCHAR(6) NOT NULL,
        notified_serial INT DEFAULT NULL,
        account VARCHAR(40) DEFAULT NULL
      );
      CREATE INDEX IF NOT EXISTS name_index ON domains(name);

      CREATE TABLE IF NOT EXISTS records (
        id SERIAL PRIMARY KEY,
        domain_id INT DEFAULT NULL,
        name VARCHAR(255) DEFAULT NULL,
        type VARCHAR(10) DEFAULT NULL,
        content VARCHAR(65535) DEFAULT NULL,
        ttl INT DEFAULT NULL,
        prio INT DEFAULT NULL,
        disabled BOOLEAN DEFAULT FALSE,
        ordername VARCHAR(255),
        auth BOOLEAN DEFAULT TRUE,
        CONSTRAINT domain_exists FOREIGN KEY (domain_id) REFERENCES domains(id) ON DELETE CASCADE
      );
      CREATE INDEX IF NOT EXISTS rec_name_index ON records(name);
      CREATE INDEX IF NOT EXISTS nametype_index ON records(name,type);
      CREATE INDEX IF NOT EXISTS domain_id ON records(domain_id);
      CREATE INDEX IF NOT EXISTS orderindex ON records(ordername);

      CREATE TABLE IF NOT EXISTS supermasters (
        ip VARCHAR(64) NOT NULL,
        nameserver VARCHAR(255) NOT NULL,
        account VARCHAR(40) DEFAULT NULL,
        PRIMARY KEY(ip, nameserver)
      );

      CREATE TABLE IF NOT EXISTS comments (
        id SERIAL PRIMARY KEY,
        domain_id INT NOT NULL,
        name VARCHAR(255) NOT NULL,
        type VARCHAR(10) NOT NULL,
        modified_at INT NOT NULL,
        account VARCHAR(40) DEFAULT NULL,
        comment VARCHAR(65535) NOT NULL,
        CONSTRAINT domain_exists FOREIGN KEY (domain_id) REFERENCES domains(id) ON DELETE CASCADE
      );
      CREATE INDEX IF NOT EXISTS comments_domain_id_index ON comments(domain_id);
      CREATE INDEX IF NOT EXISTS comments_nametype_index ON comments(name, type);
      CREATE INDEX IF NOT EXISTS comments_order_idx ON comments(domain_id, modified_at);

      CREATE TABLE IF NOT EXISTS domainmetadata (
        id SERIAL PRIMARY KEY,
        domain_id INT REFERENCES domains(id) ON DELETE CASCADE,
        kind VARCHAR(32),
        content TEXT
      );
      CREATE INDEX IF NOT EXISTS domainmetaidindex ON domainmetadata(domain_id);

      CREATE TABLE IF NOT EXISTS cryptokeys (
        id SERIAL PRIMARY KEY,
        domain_id INT REFERENCES domains(id) ON DELETE CASCADE,
        flags INT NOT NULL,
        active BOOL,
        published BOOL DEFAULT TRUE,
        content TEXT
      );
      CREATE INDEX IF NOT EXISTS domainidindex ON cryptokeys(domain_id);

      CREATE TABLE IF NOT EXISTS tsigkeys (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) UNIQUE,
        algorithm VARCHAR(50),
        secret VARCHAR(255)
      );
      CREATE INDEX IF NOT EXISTS namealgoindex ON tsigkeys(name, algorithm);

      -- Grant all privileges to pdns user
      GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO pdns;
      GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO pdns;

      -- Set default privileges for future tables
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO pdns;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO pdns;
  become_user: postgres

- name: Store passwords securely
  file:
    path: /etc/hibana/passwords
    state: directory
    mode: '0700'

- name: Save hibana database password
  copy:
    content: "{{ hibana_db_password }}"
    dest: /etc/hibana/passwords/hibana
    mode: '0600'

- name: Save pdns database password
  copy:
    content: "{{ pdns_db_password }}"
    dest: /etc/hibana/passwords/pdns
    mode: '0600'

- name: Insert webadmin user
  postgresql_query:
    db: hibana
    login_host: localhost
    login_user: hibana
    login_password: "{{ hibana_db_password }}"
    query: |
      INSERT INTO webadmin_users (username, password_hash)
      VALUES ('{{ webadmin.username }}', '{{ webadmin.password | password_hash("sha512") }}')
      ON CONFLICT (username) DO UPDATE
      SET password_hash = EXCLUDED.password_hash
  when: webadmin is defined and webadmin.username is defined

- name: Set DNS provider display name
  set_fact:
    dns_provider_display_name: >-
      {% if dns_provider.name == 'hostinger' %}Hostinger{% elif dns_provider.name == 'cloudflare' %}Cloudflare{% elif dns_provider.name == 'ovh' %}OVH{% elif dns_provider.name == 'powerdns' %}PowerDNS (Local){% else %}{{ dns_provider.name | capitalize }}{% endif %}
  when: dns_provider is defined and dns_provider.name is defined

- name: Insert or update DNS provider in database
  postgresql_query:
    db: hibana
    login_host: localhost
    login_user: hibana
    login_password: "{{ hibana_db_password }}"
    query: |
      INSERT INTO dns_providers (name, type, provider, api_token, endpoint, application_key, application_secret, consumer_key)
      VALUES (
        '{{ dns_provider_display_name | trim }}',
        '{{ dns_provider.type }}',
        '{{ dns_provider.name }}',
        {{ "'" + dns_provider.api_token + "'" if dns_provider.api_token is defined and dns_provider.api_token else 'NULL' }},
        {{ "'" + dns_provider.endpoint + "'" if dns_provider.endpoint is defined and dns_provider.endpoint else 'NULL' }},
        {{ "'" + dns_provider.application_key + "'" if dns_provider.application_key is defined and dns_provider.application_key else 'NULL' }},
        {{ "'" + dns_provider.application_secret + "'" if dns_provider.application_secret is defined and dns_provider.application_secret else 'NULL' }},
        {{ "'" + dns_provider.consumer_key + "'" if dns_provider.consumer_key is defined and dns_provider.consumer_key else 'NULL' }}
      )
      ON CONFLICT (provider)
      DO UPDATE SET
        name = EXCLUDED.name,
        type = EXCLUDED.type,
        api_token = EXCLUDED.api_token,
        endpoint = EXCLUDED.endpoint,
        application_key = EXCLUDED.application_key,
        application_secret = EXCLUDED.application_secret,
        consumer_key = EXCLUDED.consumer_key,
        updated_at = CURRENT_TIMESTAMP
  when: dns_provider is defined and dns_provider.name is defined and dns_provider.type != 'manual'

- name: Insert DNS configuration into configuration table
  postgresql_query:
    db: hibana
    login_host: localhost
    login_user: hibana
    login_password: "{{ hibana_db_password }}"
    query: |
      INSERT INTO configuration (key, value, updated_at) VALUES ('dns_provider_type', '{{ dns_provider.type }}', CURRENT_TIMESTAMP)
      ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value, updated_at = CURRENT_TIMESTAMP;
      INSERT INTO configuration (key, value, updated_at) VALUES ('dns_provider_name', '{{ dns_provider.name }}', CURRENT_TIMESTAMP)
      ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value, updated_at = CURRENT_TIMESTAMP;
  when: dns_provider is defined and dns_provider.name is defined
