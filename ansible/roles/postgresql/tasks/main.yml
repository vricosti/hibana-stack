---
- name: Ensure PostgreSQL is running
  systemd:
    name: postgresql
    state: started
    enabled: yes

- name: Generate random password for hibana database user
  set_fact:
    hibana_db_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  run_once: true

- name: Generate random password for pdns database user
  set_fact:
    pdns_db_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  run_once: true

- name: Create hibana database
  postgresql_db:
    name: hibana
    state: present
  become_user: postgres

- name: Create hibana database user
  postgresql_user:
    name: hibana
    password: "{{ hibana_db_password }}"
    db: hibana
    priv: ALL
    state: present
  become_user: postgres

- name: Create powerdns database
  postgresql_db:
    name: powerdns
    state: present
  become_user: postgres

- name: Create powerdns database user
  postgresql_user:
    name: pdns
    password: "{{ pdns_db_password }}"
    db: powerdns
    priv: ALL
    state: present
  become_user: postgres

- name: Create PowerDNS schema
  postgresql_query:
    db: powerdns
    query: |
      CREATE TABLE IF NOT EXISTS domains (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL UNIQUE,
        master VARCHAR(128) DEFAULT NULL,
        last_check INT DEFAULT NULL,
        type VARCHAR(6) NOT NULL,
        notified_serial INT DEFAULT NULL,
        account VARCHAR(40) DEFAULT NULL
      );
      CREATE INDEX IF NOT EXISTS name_index ON domains(name);

      CREATE TABLE IF NOT EXISTS records (
        id SERIAL PRIMARY KEY,
        domain_id INT DEFAULT NULL,
        name VARCHAR(255) DEFAULT NULL,
        type VARCHAR(10) DEFAULT NULL,
        content VARCHAR(65535) DEFAULT NULL,
        ttl INT DEFAULT NULL,
        prio INT DEFAULT NULL,
        disabled BOOLEAN DEFAULT FALSE,
        ordername VARCHAR(255),
        auth BOOLEAN DEFAULT TRUE,
        CONSTRAINT domain_exists FOREIGN KEY (domain_id) REFERENCES domains(id) ON DELETE CASCADE
      );
      CREATE INDEX IF NOT EXISTS rec_name_index ON records(name);
      CREATE INDEX IF NOT EXISTS nametype_index ON records(name,type);
      CREATE INDEX IF NOT EXISTS domain_id ON records(domain_id);
      CREATE INDEX IF NOT EXISTS orderindex ON records(ordername);

      CREATE TABLE IF NOT EXISTS supermasters (
        ip VARCHAR(64) NOT NULL,
        nameserver VARCHAR(255) NOT NULL,
        account VARCHAR(40) DEFAULT NULL,
        PRIMARY KEY(ip, nameserver)
      );

      CREATE TABLE IF NOT EXISTS comments (
        id SERIAL PRIMARY KEY,
        domain_id INT NOT NULL,
        name VARCHAR(255) NOT NULL,
        type VARCHAR(10) NOT NULL,
        modified_at INT NOT NULL,
        account VARCHAR(40) DEFAULT NULL,
        comment VARCHAR(65535) NOT NULL,
        CONSTRAINT domain_exists FOREIGN KEY (domain_id) REFERENCES domains(id) ON DELETE CASCADE
      );
      CREATE INDEX IF NOT EXISTS comments_domain_id_index ON comments(domain_id);
      CREATE INDEX IF NOT EXISTS comments_nametype_index ON comments(name, type);
      CREATE INDEX IF NOT EXISTS comments_order_idx ON comments(domain_id, modified_at);

      CREATE TABLE IF NOT EXISTS domainmetadata (
        id SERIAL PRIMARY KEY,
        domain_id INT REFERENCES domains(id) ON DELETE CASCADE,
        kind VARCHAR(32),
        content TEXT
      );
      CREATE INDEX IF NOT EXISTS domainmetaidindex ON domainmetadata(domain_id);

      CREATE TABLE IF NOT EXISTS cryptokeys (
        id SERIAL PRIMARY KEY,
        domain_id INT REFERENCES domains(id) ON DELETE CASCADE,
        flags INT NOT NULL,
        active BOOL,
        published BOOL DEFAULT TRUE,
        content TEXT
      );
      CREATE INDEX IF NOT EXISTS domainidindex ON cryptokeys(domain_id);

      CREATE TABLE IF NOT EXISTS tsigkeys (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) UNIQUE,
        algorithm VARCHAR(50),
        secret VARCHAR(255)
      );
      CREATE INDEX IF NOT EXISTS namealgoindex ON tsigkeys(name, algorithm);
  become_user: postgres

- name: Store passwords securely
  file:
    path: /etc/hibana/passwords
    state: directory
    mode: '0700'

- name: Save hibana database password
  copy:
    content: "{{ hibana_db_password }}"
    dest: /etc/hibana/passwords/hibana
    mode: '0600'

- name: Save pdns database password
  copy:
    content: "{{ pdns_db_password }}"
    dest: /etc/hibana/passwords/pdns
    mode: '0600'
