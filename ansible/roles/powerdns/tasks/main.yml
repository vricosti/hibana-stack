---
- name: Open firewall ports for DNS (TCP)
  ufw:
    rule: allow
    port: '53'
    proto: tcp
  when: ansible_facts.services['ufw.service'] is defined

- name: Open firewall ports for DNS (UDP)
  ufw:
    rule: allow
    port: '53'
    proto: udp
  when: ansible_facts.services['ufw.service'] is defined

- name: Read pdns database password
  slurp:
    src: /etc/hibana/passwords/pdns
  register: pdns_password_file

- name: Set pdns password fact
  set_fact:
    pdns_db_password: "{{ pdns_password_file['content'] | b64decode | trim }}"

- name: Generate random password for PowerDNS API
  set_fact:
    pdns_api_key: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
  run_once: true

- name: Test PowerDNS database connection
  postgresql_query:
    db: powerdns
    login_user: pdns
    login_password: "{{ pdns_db_password }}"
    login_host: localhost
    query: "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'domains'"
  register: pdns_db_test
  become_user: postgres

- name: Verify domains table exists
  assert:
    that:
      - pdns_db_test.rowcount > 0
    fail_msg: "PowerDNS domains table does not exist"
    success_msg: "PowerDNS database connection successful"

- name: Backup existing PowerDNS configuration
  copy:
    src: /etc/powerdns/pdns.conf
    dest: /etc/powerdns/pdns.conf.backup
    remote_src: yes
    force: no
  ignore_errors: yes

- name: Configure PowerDNS
  template:
    src: pdns.conf.j2
    dest: /etc/powerdns/pdns.conf
    owner: pdns
    group: pdns
    mode: '0640'
  notify: Restart PowerDNS

- name: Ensure PowerDNS is enabled and started
  systemd:
    name: pdns
    state: started
    enabled: yes

- name: Wait for PowerDNS to be ready
  wait_for:
    port: 53
    host: 127.0.0.1
    timeout: 30

- name: Configure /etc/resolv.conf for PowerDNS
  copy:
    content: |
      # Generated by Hibana Stack
      # Use local PowerDNS first
      nameserver 127.0.0.1
      # Fallback to public DNS servers
      nameserver 8.8.8.8
      nameserver 8.8.4.4
      nameserver 1.1.1.1
    dest: /etc/resolv.conf
    mode: '0644'

- name: Make resolv.conf immutable
  file:
    path: /etc/resolv.conf
    attributes: +i
  ignore_errors: yes

- name: Store primary domain in Hibana database
  postgresql_query:
    db: hibana
    login_user: hibana
    login_password: "{{ hibana_db_password }}"
    login_host: localhost
    query: |
      INSERT INTO domains (name, server_ip)
      VALUES ('{{ primary_domain }}', '{{ server_ip }}')
      ON CONFLICT (name) DO NOTHING
  become_user: postgres

- name: Save PowerDNS API key
  copy:
    content: "{{ pdns_api_key }}"
    dest: /etc/hibana/passwords/pdns-api
    mode: '0600'
