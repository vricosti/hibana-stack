---
- name: Fix /etc/hosts for hostname resolution
  lineinfile:
    path: /etc/hosts
    line: "127.0.1.1 {{ ansible_fqdn }} {{ ansible_hostname }}"
    regexp: '^127\.0\.1\.1'
    state: present

- name: Check Ubuntu distribution
  assert:
    that:
      - ansible_distribution == "Ubuntu"
    fail_msg: "Ubuntu is required"
    success_msg: "Ubuntu detected"

- name: Preconfigure Postfix
  debconf:
    name: postfix
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: "{{ item.vtype }}"
  loop:
    - { question: 'postfix/main_mailer_type', value: 'Internet Site', vtype: 'select' }
    - { question: 'postfix/mailname', value: '{{ primary_domain }}', vtype: 'string' }

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - docker.io
      - docker-compose
      - postfix
      - dovecot-core
      - dovecot-imapd
      - dovecot-pop3d
      - dovecot-lmtpd
      - dovecot-sieve
      - dovecot-managesieved
      - opendkim
      - opendkim-tools
      - openssl
      - mailutils
      - pdns-server
      - pdns-backend-pgsql
      - spamassassin
      - spamc
      - python3-psycopg2
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Ensure Docker socket is enabled and started
  systemd:
    name: docker.socket
    enabled: yes
    state: started

- name: Ensure Docker service is enabled and started
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Stop systemd-resolved
  systemd:
    name: systemd-resolved
    state: stopped
    enabled: no

- name: Remove immutable flag from /etc/resolv.conf
  command: chattr -i /etc/resolv.conf
  failed_when: false
  changed_when: false

- name: Remove /etc/resolv.conf
  file:
    path: /etc/resolv.conf
    state: absent

- name: Configure temporary resolv.conf
  copy:
    content: |
      # Temporary DNS configuration - will be updated after PowerDNS setup
      nameserver 8.8.8.8
      nameserver 8.8.4.4
      nameserver 1.1.1.1
    dest: /etc/resolv.conf
    mode: '0644'
