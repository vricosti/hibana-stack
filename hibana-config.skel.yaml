primary_domain: example.com
server_ip: YOUR_SERVER_IP

# DNS provider configuration (optional)
# If configured, DNS records will be automatically created/updated
# Supported providers: hostinger
# dns_provider:
#   name: hostinger
#   api_token: YOUR_HOSTINGER_API_TOKEN

subdomains:
    - name: adm
      role: webadmin
    - name: mail
      role: mailserver
    - name: webmail
      role: webmail
    - name: www
      role: website

# Web admin credentials (for adm.example.com)
# Used to login to the administration interface
webadmin:
    username: admin
    password: __RANDOM_WEBADMIN_PASSWORD__

# Email accounts for the domain
email_accounts:
    - username: admin
      password: __RANDOM_EMAIL_PASSWORD__
      full_name: Administrator

# Test email for sending test messages
test_email: your-email@example.com

# Domain user configuration
# Creates a dedicated system user for managing the domain (e.g., example_com)
# The user will have access to /srv/example.com/ and limited docker commands
# Can login via SSH with password or SSH key
domain_user:
  # Password for SSH login (auto-generated)
  password: __RANDOM_DOMAIN_USER_PASSWORD__

  # SSH key mode: "auto" or "manual"
  # - auto: Automatically generate SSH key pair (private key will be displayed once)
  # - manual: Use the SSH public key provided below
  ssh_key_mode: auto

  # SSH public key (required only in manual mode)
  # Example:
  # ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBtpvjKPQGY8mMxJZT... user@example.com"
  # ssh_public_key: ""

# Optional: System users with sudo access (for administrators)
# system_users:
#   - username: admin
#     password: secure_password
#     name: "System Administrator"
#     sudoers: true
#     ssh_pub_key: "ssh-rsa AAAAB3NzaC1yc2EA..."
